<div class="client-details-container">
  <h4 class="details-title">Szczegóły klienta</h4>
  <p *ngIf="!client" class="no-client-message">
    Wybierz klienta z listy, aby przeglądać szczegóły
  </p>
  <div *ngIf="client" class="details-content">
    <p><strong>Id:</strong> {{ client.id }}</p>
    <p><strong>Firstname:</strong> {{ client.firstName }}</p>
    <p><strong>Lastname:</strong> {{ client.lastName }}</p>
    <p><strong>Client Type:</strong> {{ client.clientType }}</p>
    <p><strong>Phone Number:</strong> {{ client.phoneNumber }}</p>
    <p><strong>Address:</strong> {{ client.address }}</p>
    <p><strong>Email:</strong> {{ client.email }}</p>
    <div class="button-container">
      <button mat-button class="update-button" (click)="onClientEdit(client)">Edytuj klienta</button>
      <button mat-button class="delete-button" (click)="onClientRemove(client)">Usuń klienta</button>
    </div>    
  </div>
</div>
